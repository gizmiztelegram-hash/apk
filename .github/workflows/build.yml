name: Build Android APK (Chaikhaneh)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Zip If Exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found zip file in repository, extracting..."
            unzip -o -q "*.zip" || true
          fi

      - name: 1. Install Dependencies & Tools
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev --legacy-peer-deps sharp
          npm install --save --legacy-peer-deps @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: 2. Build Web Application
        run: |
          npm run build

      - name: 3. Configure Capacitor & Sync Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 4. Apply Tea Cup App Icon
        run: |
          node fix-android-icons.mjs

      - name: 5. Configure Signed Release
        run: |
          python3 - << 'PYEOF'
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          import re
          content = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.chaikhaneh.game"', content)
          content = re.sub(r'versionCode\s+\d+', 'versionCode 2', content)
          content = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.0.2"', content)

          release_replacement = """release {
              signingConfig signingConfigs.debug
              minifyEnabled false
              shrinkResources false
              proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
          }"""
          content = re.sub(r'release\s*\{[^}]*\}', release_replacement, content)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print("Signed release config applied successfully")
          PYEOF

      - name: 6. Compile & Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease assembleDebug --no-daemon -x lint -x test

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaikhaneh-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Chaikhaneh-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
